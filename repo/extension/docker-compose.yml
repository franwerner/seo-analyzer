services:
  extension:
    build: .
    container_name: seo-analyzer-extension
    image: seo-analyzer-extension:1.0
    ports:
      - ${PORT}:${PORT}
    env_file:
      - ./.env
    command: npm run dev
    networks:
      - seo-analyzer-network
    develop:
      watch:
        - action: sync
          path: ./
          target: /app
          initial_sync: true
          ignore:
            - node_modules
            - dist
networks:
  seo-analyzer-network:
    external: true
